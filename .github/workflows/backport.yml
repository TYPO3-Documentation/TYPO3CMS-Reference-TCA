name: Backport
on:
  pull_request_target:
    types:
      - closed
      - labeled

jobs:
  backport:
    runs-on: ubuntu-latest
    name: Backport
    permissions:
      contents: write        # needed to push the backport branch
      pull-requests: write   # needed to open the PR
    steps:
      - name: Backport
        uses: m-kuhn/backport@74eb973c022c9abb04555b3fde955fbe056d78f5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
